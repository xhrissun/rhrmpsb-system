name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # or master, depending on your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build
        # VITE_DOC_PROXY_BASE points the app at the Cloudflare Worker that
        # proxies AI-evaluate document bytes with zero Render bandwidth
        # cost (see cloudflare-worker/README.md). Set it as a repo secret
        # (Settings > Secrets and variables > Actions) once the Worker is
        # deployed. If left unset, the app falls back to fetching documents
        # through Render directly — functional, but brings back the
        # bandwidth cost this exists to avoid.
        run: npm run build
        env:
          VITE_DOC_PROXY_BASE: ${{ secrets.VITE_DOC_PROXY_BASE }}
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4